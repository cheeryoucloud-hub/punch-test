<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>啓宇打卡後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#1B2430; --muted:#7C8994;
    --line:#EBEEF1; --brand:#16A34A; --brand-2:#22C55E; --brand-soft:#E7F6EC; --brand-ink:#15803D;
    --amber:#B7791F; --amber-soft:#FDF2E0; --ok:#16A34A; --ok-soft:#E7F6EC; --danger:#DC2626; --danger-soft:#FCEBEB;
    --blue:#2563EB; --blue-soft:#EAF1FE; --pink-soft:#FDECEF; --purple:#7C5CD6;
    --side:#FFFFFF; --side-ink:#37424E; --side-muted:#9AA6B0; --side-line:#EEF1F3;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#151E19; --surface-2:#1a2620; --ink:#E7EFEA; --muted:#93A29A;
    --line:#26332D; --brand:#34D07F; --brand-2:#3fdd8a; --brand-soft:#16281F; --brand-ink:#4ADE80;
    --amber:#E0A93C; --amber-soft:#2c2413; --ok:#34D07F; --ok-soft:#16281F; --danger:#F0736A; --danger-soft:#2e1613;
    --blue:#6AA6F0; --blue-soft:#132132; --pink-soft:#2c1519; --side:#111A15; --side-ink:#cdd8d1; --side-muted:#7f8d84; --side-line:#202c25;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1512; --surface:#151E19; --surface-2:#1a2620; --ink:#E7EFEA; --muted:#93A29A;
    --line:#26332D; --brand:#34D07F; --brand-2:#3fdd8a; --brand-soft:#16281F; --brand-ink:#4ADE80;
    --amber:#E0A93C; --amber-soft:#2c2413; --ok:#34D07F; --ok-soft:#16281F; --danger:#F0736A; --danger-soft:#2e1613;
    --blue:#6AA6F0; --blue-soft:#132132; --pink-soft:#2c1519; --side:#111A15; --side-ink:#cdd8d1; --side-muted:#7f8d84; --side-line:#202c25;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC",system-ui,"PingFang TC",sans-serif; font-size:14px; line-height:1.55; }
  .tnum{ font-variant-numeric:tabular-nums; }
  .hidden{ display:none !important; }
  .muted,.hint{ color:var(--muted); }
  .hint{ font-size:11.5px; font-weight:600; }

  /* login */
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px 28px; width:100%; max-width:360px; box-shadow:0 12px 40px rgba(20,30,40,.08); }
  .bm{ display:flex; align-items:center; gap:11px; }
  .bm .logo{ width:38px; height:38px; border-radius:11px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:19px; }
  .bm b{ font-size:16px; font-weight:900; } .bm span{ display:block; font-size:11px; color:var(--muted); font-weight:500; letter-spacing:.5px; }
  .login label{ font-size:12px; color:var(--muted); font-weight:700; display:block; margin:14px 2px 6px; }
  .login input{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--surface-2); color:var(--ink); font-size:14px; }
  .signin{ width:100%; margin-top:18px; border:none; border-radius:11px; padding:13px; background:var(--brand); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  .signin:disabled{ opacity:.6; }
  .lerr{ color:var(--danger); font-size:12.5px; font-weight:700; min-height:18px; margin-top:10px; text-align:center; }

  /* shell */
  .app{ display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
  .side{ background:var(--side); border-right:1px solid var(--side-line); padding:18px 14px; display:flex; flex-direction:column; }
  .side .bm b{ color:var(--ink); }
  .navgrp{ margin-top:16px; } .navgrp .cap{ font-size:10.5px; letter-spacing:1px; color:var(--side-muted); font-weight:700; padding:0 10px; margin-bottom:5px; }
  .nav{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:11px; color:var(--side-ink); font-size:13.5px; font-weight:600; margin-bottom:2px; cursor:pointer; }
  .nav:hover{ background:var(--surface-2); }
  .nav.on{ background:var(--brand-soft); color:var(--brand-ink); font-weight:800; }
  .nav svg{ width:18px; height:18px; flex:0 0 18px; opacity:.9; }
  .nav .bdg{ margin-left:auto; background:var(--danger); color:#fff; font-size:11px; font-weight:800; min-width:19px; height:19px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
  .whoami{ margin-top:auto; padding-top:12px; border-top:1px solid var(--side-line); }
  .whoami .nm{ font-weight:800; } .whoami .rl{ font-size:11.5px; color:var(--side-muted); }
  .logout{ margin-top:10px; width:100%; background:var(--surface-2); color:var(--side-ink); border:1px solid var(--line); border-radius:9px; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; }

  .main{ padding:22px 26px 40px; overflow:auto; }
  .top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
  .eyebrow{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .top h1{ font-size:22px; font-weight:900; margin-top:1px; }
  .top .rgt{ display:flex; align-items:center; gap:10px; }
  .iconbtn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .userchip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:5px 12px 5px 12px; }
  .userchip .rp{ font-size:11px; font-weight:800; color:var(--brand-ink); background:var(--brand-soft); padding:3px 9px; border-radius:20px; } .userchip .nm{ font-size:13px; font-weight:700; }

  .greet{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .greet .g{ font-size:14px; font-weight:600; }
  .mstep{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:4px; }
  .mstep button{ border:none; background:transparent; color:var(--muted); width:30px; height:30px; border-radius:8px; font-size:16px; font-weight:800; cursor:pointer; }
  .mstep button:hover{ background:var(--surface-2); }
  .mstep .lb{ font-weight:800; font-size:13.5px; padding:0 6px; min-width:96px; text-align:center; }
  .mstep .now{ background:var(--brand); color:#fff; border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:800; cursor:pointer; }
  .mstep .dp{ position:relative; } .mstep .dp input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px; margin-bottom:18px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px 16px; display:flex; gap:12px; align-items:flex-start; }
  .stat.pink{ background:var(--pink-soft); border-color:transparent; }
  .mapthumb{ position:relative; width:104px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line); display:block; background:var(--surface-2); }
  .mapthumb img{ position:absolute; width:256px; height:256px; left:50%; top:50%; transform:translate(-50%,-50%); image-rendering:auto; }
  .mapthumb .pin{ position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); font-size:16px; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .mapthumb .go{ position:absolute; left:0; right:0; bottom:0; background:rgba(15,25,20,.62); color:#fff; font-size:10px; font-weight:700; text-align:center; padding:2px 0; opacity:0; transition:opacity .12s; }
  .mapthumb:hover .go{ opacity:1; }
  .stat.clickable{ cursor:pointer; transition:border-color .12s,box-shadow .12s; }
  .stat.clickable:hover{ border-color:var(--brand); box-shadow:0 4px 14px rgba(22,163,74,.16); }
  .stat .ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 38px; }
  .stat .ic svg{ width:19px; height:19px; }
  .ic.g{ background:var(--brand-soft); color:var(--brand); } .ic.a{ background:var(--amber-soft); color:var(--amber); }
  .ic.b{ background:var(--blue-soft); color:var(--blue); } .ic.r{ background:var(--danger-soft); color:var(--danger); }
  .stat .lab{ font-size:12px; color:var(--muted); font-weight:600; } .stat .lab .sm{ color:var(--brand-ink); font-weight:700; }
  .stat .val{ font-size:27px; font-weight:900; margin-top:1px; } .stat .val small{ font-size:13px; font-weight:700; color:var(--muted); }
  .stat .sub{ font-size:11.5px; color:var(--muted); }
  .donut{ width:56px; height:56px; border-radius:50%; flex:0 0 56px; display:flex; align-items:center; justify-content:center; position:relative; }
  .donut::before{ content:""; position:absolute; width:38px; height:38px; border-radius:50%; background:var(--surface); }
  .donut span{ position:relative; font-size:13px; font-weight:900; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:16px; }
  .panel > h2{ font-size:15px; font-weight:800; margin-bottom:13px; display:flex; align-items:center; gap:8px; }
  .count{ font-size:11px; font-weight:800; color:var(--amber); background:var(--amber-soft); padding:2px 9px; border-radius:20px; }
  .count.grn{ color:var(--brand-ink); background:var(--brand-soft); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:760px){ .grid2{ grid-template-columns:1fr; } }
  .chiplist{ display:flex; flex-direction:column; gap:8px; }
  .lrow{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--surface-2); border-radius:10px; font-size:13px; }
  .sitegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:13px; }
  .sitecard{ border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
  .sitecard .sh{ font-weight:800; font-size:13.5px; margin-bottom:9px; display:flex; align-items:center; gap:7px; }
  .sitecard .sh i{ width:8px; height:8px; border-radius:50%; background:var(--brand); display:inline-block; }
  .sitecard .sh .c{ margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:700; }
  .mini{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .mini th{ font-size:11px; color:var(--muted); font-weight:600; text-align:left; padding:3px 4px; }
  .mini td{ padding:4px 4px; border-top:1px solid var(--line); }
  .mini td.tnum{ text-align:right; } .mini .lv{ color:var(--brand-ink); font-weight:700; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th,.tbl td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  .tbl th{ font-size:11.5px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .tbl td b{ white-space:nowrap; }
  .tbl tbody tr:hover{ background:var(--surface-2); }
  .tblwrap{ overflow-x:auto; }
  .r{ text-align:right; }

  .pill{ font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; display:inline-block; white-space:nowrap; }
  .pill.wait{ background:var(--amber-soft); color:var(--amber); } .pill.ok{ background:var(--ok-soft); color:var(--ok); }
  .pill.bad{ background:var(--danger-soft); color:var(--danger); } .pill.info{ background:var(--blue-soft); color:var(--blue); } .pill.mut{ background:var(--surface-2); color:var(--muted); }

  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:6px 13px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn.ap{ background:var(--brand); color:#fff; border-color:transparent; } .btn.rj{ color:var(--danger); border-color:var(--danger-soft); }
  .btn.sm{ padding:5px 11px; font-size:12px; } .btn:disabled{ opacity:.4; cursor:default; }
  .actions{ display:flex; gap:7px; justify-content:flex-end; }
  .add{ background:var(--brand); color:#fff; border:none; border-radius:10px; padding:8px 15px; font-weight:800; font-size:12.5px; cursor:pointer; }
  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar select,.toolbar input{ padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font-size:12.5px; font-family:inherit; }
  .spacer{ margin-left:auto; }

  /* transfer */
  .tf{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .tf.act{ border-left:3px solid var(--amber); }
  .tf-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; } .tf-h b{ font-size:15px; }
  .tf-d{ font-size:13.5px; } .tf-r{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .signrow{ display:flex; gap:12px; margin-top:13px; }
  .sign{ flex:1; border:1px dashed var(--line); border-radius:11px; padding:10px 12px; text-align:center; }
  .sign .role{ font-size:11px; color:var(--muted); font-weight:700; } .sign .who{ font-weight:800; margin-top:2px; }
  .sign.signed{ border-style:solid; background:var(--brand-soft); border-color:transparent; } .sign.signed .who{ color:var(--brand-ink); }
  .sign .act2{ display:flex; gap:6px; margin-top:8px; }
  .sign .act2 .btn{ flex:1; }

  /* 輪休表(照舊系統樣式,只換配色) */
  .rwrap{ overflow-x:auto; }
  table.roster{ border-collapse:collapse; font-size:13px; width:100%; }
  table.roster th,table.roster td{ border:1px solid #dce6e2; padding:4px 3px; text-align:center; min-width:22px; height:26px; color:var(--ink); }
  table.roster th{ background:#eaf1ee; color:#38544d; font-weight:700; }
  table.roster .we{ background:#f8f4f1; color:#b06b45; }
  table.roster .lh{ background:#e7eff2; font-weight:bold; white-space:nowrap; min-width:52px; padding:4px 8px; }
  table.roster .rname{ text-align:left; min-width:76px; white-space:nowrap; font-weight:700; padding:4px 8px; }
  table.roster td.rcell{ color:#6b7280; }                    /* 預定＝灰 */
  table.roster td.radj{ color:#c00000; font-weight:bold; }   /* 人資調整＝紅 */
  table.roster td.lvcancel::after{ content:''; display:inline-block; width:15px; height:15px; border:1.6px dashed #8a8f98; border-radius:50%; vertical-align:middle; }
  table.roster td.blue{ background:#00B0F0; color:#062a3a; font-weight:bold; }
  table.roster td[data-tip]{ cursor:help; }
  table.roster th.sp-y{ background:#FFFF00; color:#333; } table.roster th.sp-g{ background:#92D050; color:#123; } table.roster th.sp-o{ background:#FFC000; color:#331; }
  table.roster tr:hover td.rcell:not(.blue), table.roster tr:hover td.rname{ background:#e3f2ea; }
  #rHost.editing td.rcell,#rHost.editing td.rname{ cursor:pointer; }
  #rHost.editing td.rcell:hover{ background:#fff3cd; }
  #rHost.editing th.dcol{ cursor:pointer; }
  #rHost.editing th.dcol:hover{ outline:2px solid #f59e0b; outline-offset:-2px; }
  .rmtitle{ text-align:center; font-size:18px; font-weight:800; margin-bottom:12px; }
  .rnotes{ color:#c00000; font-weight:bold; font-size:13px; white-space:pre-line; }
  .rmlegend .dashleg{ display:inline-block; width:13px; height:13px; border:1.6px dashed #8a8f98; border-radius:50%; vertical-align:middle; }
  #rHost.editing th.dcol{ cursor:pointer; }
  /* 預定輪休表矩陣 */
  .rgrid{ overflow-x:auto; }
  .rmtitle{ text-align:center; font-size:16px; font-weight:800; margin-bottom:12px; }
  .rmx{ border-collapse:collapse; font-size:11px; table-layout:fixed; }
  .rmx th,.rmx td{ border:1px solid var(--line); text-align:center; height:24px; line-height:1; overflow:hidden; }
  .rmx thead th{ background:var(--surface-2); font-weight:700; padding:2px 2px; }
  .rmx thead th.we{ color:#c2597c; }
  .rmx td.hcell{ font-weight:700; padding:0 6px; white-space:nowrap; background:var(--surface); text-overflow:ellipsis; }
  .rmx td.hboss{ background:var(--surface-2); }
  .rmx td.hnm{ text-align:left; font-weight:600; }
  .rmx td.rc{ font-weight:800; cursor:default; padding:0; }
  .rmx td.rc.ed{ cursor:pointer; } .rmx td.rc.ed:hover{ outline:2px solid var(--brand); outline-offset:-2px; }
  .rmx td.rc.we{ background:var(--surface-2); }
  .rmx td.rc.src-plan{ color:#5b6570; } .rmx td.rc.src-adj{ color:#c00000; }
  .rmx td.rc.src-cancel{ color:#c00000; }
  .rmx td.rc.blue{ background:#00B0F0 !important; color:#062a3a; font-weight:900; }
  .rmx td.rc[data-tip]{ cursor:help; }
  .rmx thead th.sp-y{ background:#FFFF00; color:#333; } .rmx thead th.sp-g{ background:#92D050; color:#123; } .rmx thead th.sp-o{ background:#FFC000; color:#331; }
  .rmx thead th.ed{ cursor:pointer; }
  #rtip{ position:fixed; z-index:9999; display:none; background:#1f2d29; color:#fff; font-size:12px; line-height:1.55; padding:8px 11px; border-radius:8px; box-shadow:0 8px 22px rgba(0,0,0,.24); pointer-events:none; max-width:240px; white-space:pre-line; }
  .rmlegend{ margin-top:12px; font-size:12px; color:var(--muted); }
  .rmlegend b{ color:var(--ink); }
  .rmlegend .sw{ display:inline-block; width:13px; height:13px; border-radius:3px; vertical-align:-2px; margin-right:3px; }
  .rmlegend .lg-plan{ color:#5b6570; font-weight:700; } .rmlegend .lg-adj,.rmlegend .lg-cancel{ color:#c00000; font-weight:700; }
  .notesbox{ margin-top:16px; } .notesbox label{ font-size:12px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px; }
  .notesbox textarea{ width:100%; border:1px solid var(--line); border-radius:11px; padding:10px 12px; font-size:13px; font-family:inherit; background:var(--surface-2); color:var(--ink); resize:vertical; }
  .rnotes{ white-space:pre-line; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:11px 13px; font-size:13px; }

  /* 出勤表(民國年+加班) */
  .report{ border:1px solid var(--line); border-radius:10px; padding:18px; background:var(--surface); }
  .report h3{ text-align:center; font-size:17px; letter-spacing:2px; margin:0; } .report h4{ text-align:center; font-size:14px; margin:4px 0 8px; }
  .report .rmeta{ display:flex; justify-content:space-between; font-size:13px; margin:2px 4px 12px; }
  table.att{ width:100%; border-collapse:collapse; font-size:12px; }
  .att th,.att td{ border:1px solid var(--line); padding:4px 6px; text-align:center; height:22px; }
  .att th{ background:var(--surface-2); font-weight:700; }
  .att td.lv{ color:#000; font-weight:600; }
  .att td.st{ color:var(--amber); font-weight:700; }
  .sigfoot{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px; }
  .sigfoot div{ border-top:1px solid var(--ink); padding-top:6px; font-size:12px; text-align:center; color:var(--muted); }
  .rnote{ font-size:11.5px; color:var(--muted); margin-top:12px; }

  .empty{ text-align:center; color:var(--muted); padding:40px 0; } .empty .ei{ font-size:30px; opacity:.4; }
  .spin{ text-align:center; color:var(--muted); padding:34px 0; }

  /* modal */
  .modal{ position:fixed; inset:0; background:rgba(15,22,30,.5); display:flex; align-items:center; justify-content:center; z-index:80; padding:16px; }
  .modal .box{ background:var(--surface); border-radius:16px; max-width:440px; width:100%; padding:20px 22px; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3{ margin:0 0 14px; font-size:16px; font-weight:800; }
  .modal .field{ margin-bottom:12px; } .modal label{ font-size:12px; color:var(--muted); font-weight:700; display:block; margin-bottom:5px; }
  .modal input,.modal select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); font-size:14px; font-family:inherit; }
  .modal .row2{ display:flex; gap:10px; } .modal .row2>*{ flex:1; }
  .modal .acts{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }

  /* 出勤表(照公司 A4 格式) */
  .report{ background:#fff; color:#000; border:1px solid var(--line); border-radius:10px; padding:16px 22px; }
  .rpt-co{ text-align:center; font-size:16px; font-weight:700; letter-spacing:1px; }
  .rpt-ti{ text-align:center; font-size:18px; font-weight:800; margin:2px 0 10px; } .rpt-ti u{ padding:0 7px; }
  .rpt-meta{ display:flex; gap:44px; font-size:13px; margin:0 2px 8px; }
  table.att{ width:100%; border-collapse:collapse; font-size:12px; }

  .rpt-notes{ font-size:9.5px; color:#333; margin-top:8px; line-height:1.5; } .rpt-notes p{ margin:2px 0; }
  .a4{ width:210mm; min-height:297mm; margin:0 auto 18px; background:#fff; padding:12mm 10mm; box-shadow:0 2px 14px rgba(20,30,50,.14); box-sizing:border-box; }

  @media print{
    .report{ border:none; padding:0; } table.att{ font-size:10.5px; } .att th,.att td{ height:auto; padding:1px 3px; }
    .rpt-notes{ font-size:8.5px; } @page{ size:A4 portrait; margin:8mm; }
  }
  /* 調休申請(參考圖版面) */
  .tfsteps{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink); font-weight:700; justify-content:flex-end; }
  .tfsteps .st{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .tfsteps .st.dim{ color:var(--muted); }

  .tfsteps .st.dim .n{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .tfsteps .ln{ width:64px; height:1px; background:var(--line); }

  .tfcard{ border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:var(--surface); }
  .tfcard .cap{ font-weight:800; font-size:14px; margin-bottom:10px; }
  .tfcard .cap .auto{ font-size:10.5px; font-weight:800; color:var(--brand-ink); background:var(--brand-soft); border-radius:8px; padding:2px 8px; margin-left:6px; }
  .tfcard input[type=date]{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit; }
  .tfhalf{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .tfslot{ background:var(--brand-soft); border:1px solid transparent; border-radius:10px; padding:8px 12px; }
  .tfslot .sl{ font-size:11px; color:var(--muted); font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .tfslot .sl .auto{ font-size:10px; color:var(--brand-ink); background:rgba(255,255,255,.7); border-radius:6px; padding:1px 6px; font-weight:800; }
  .tfslot b{ font-size:14.5px; display:block; margin-top:2px; }
  .tfslot select{ width:100%; border:none; background:transparent; font-size:14px; font-weight:800; color:var(--ink); font-family:inherit; padding:3px 0 0; }
  .tfarrow{ display:flex; align-items:center; justify-content:center; color:var(--brand); font-size:24px; font-weight:800; }
  /* 申請紀錄卡（參考圖：左資訊、右核准狀態） */
  .tfrow{ display:grid; grid-template-columns:130px 26px 130px minmax(140px,1fr) 300px; gap:12px; align-items:start; margin-top:8px; }
  @media(max-width:1150px){ .tfrow{ grid-template-columns:130px 26px 130px 1fr; } .tfrow>div:nth-child(5){ grid-column:1/-1; } }
  .cap7{ font-size:11px; color:var(--muted); font-weight:700; margin-bottom:3px; }
  .dch .d1{ font-size:13.5px; font-weight:800; } .dch .d2{ font-size:12.5px; margin-top:2px; line-height:1.5; }
  .rsn{ font-size:13.5px; font-weight:700; }
  .tfrow>div:nth-child(4),.tfrow>div:nth-child(5){ border-left:1px solid var(--line); padding-left:14px; }
  @media(max-width:1150px){ .tfrow>div:nth-child(5){ border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:10px; margin-top:4px; } }
  .signrow2{ display:flex; gap:8px; }
  .sg{ flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:7px 8px; text-align:center; }
  .sg.okd{ background:var(--brand-soft); border-color:transparent; }
  .sg .r7{ font-size:10.5px; color:var(--muted); font-weight:700; }
  .sg .w7{ font-weight:800; font-size:13px; margin-top:1px; }
  .sg.unsign{ cursor:pointer; } .sg.unsign:hover{ outline:2px solid var(--danger); outline-offset:-2px; }
  .sg .unhint{ font-size:9.5px; color:var(--muted); margin-top:2px; opacity:0; transition:opacity .12s; }
  .sg.unsign:hover .unhint{ opacity:1; color:var(--danger); font-weight:700; }
  .sg.okd .w7{ color:var(--brand-ink); }
  @media(max-width:900px){ .tfrow{ grid-template-columns:1fr 26px 1fr; } .tfrow>div:nth-child(4),.tfrow>div:nth-child(5){ grid-column:1/-1; } }
  .tfstat{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tfstat .tc{ font-size:12px; font-weight:800; border-radius:20px; padding:4px 12px; cursor:pointer; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .tfstat .tc.on{ background:var(--brand-soft); color:var(--brand-ink); border-color:transparent; }
  .tfstat .tc .num{ margin-left:4px; }
  @media(max-width:760px){ .tfcards{ grid-template-columns:1fr; } .tfarrow{ transform:rotate(90deg); } }
  .tfform{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px 14px; }
  .tfform .ff{ display:flex; flex-direction:column; } .tfform .ff.wide{ grid-column:1 / -1; }
  .tfform label{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:5px; }
  .tfform select,.tfform input{ padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font-size:13.5px; font-family:inherit; }
  .tfform select:disabled{ background:var(--surface-2); color:var(--ink); }
  .tfform .auto{ font-size:10px; font-weight:800; color:var(--brand-ink); background:var(--brand-soft); border-radius:8px; padding:1px 6px; margin-left:4px; }
  @media(max-width:900px){ .tfform{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:820px){ .app{ grid-template-columns:1fr; } .side{ display:none; } .tfform{ grid-template-columns:1fr; } }
  @media print{
    .side,.top,.toolbar,.mstep,.add,.noprint{ display:none !important; }
    .app{ display:block; } .main{ padding:0; } .panel{ border:none; padding:0; margin:0; }
    .report{ border:none; padding:0; } @page{ size:A4 portrait; margin:12mm; }
  }
</style>

<body>

<!-- 登入 -->
<div id="login" class="login">
  <div class="login-card">
    <div class="bm"><div class="logo">啓</div><div><b>啓宇營造</b><span>WORKSITE · 打卡管理後台</span></div></div>
    <label>帳號</label><input id="lgUser" autocomplete="username">
    <label>密碼</label><input id="lgPass" type="password" autocomplete="current-password">
    <button class="signin" id="lgBtn">登入</button>
    <div class="lerr" id="lgErr"></div>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="bm"><div class="logo">啓</div><div><b>啓宇營造</b><span>WORKSITE HR</span></div></div>
    <nav id="navbox"></nav>
    <div class="whoami"><div class="nm" id="waName">—</div><div class="rl" id="waRole">—</div>
      <button class="logout" id="btnLogout">登出</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modalHost"></div>

<script>
/* ===================== 設定 ===================== */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx6fUEPK68TdacpmWVzk-0t_0fQMOqUjyRWm_RastD9YY-fkST9Lzaqg5Pq0gP18Af3/exec';
/* ============================================== */

var TOKEN='', ME={name:'',role:''};
var state={ screen:'overview', ym:'', ovDate:'', ovCur:'', roster:null };
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function p2(n){return (n<10?'0':'')+n;}
function cid(x){ var s=String(x==null?'':x).trim(); return /^\d+$/.test(s)?String(parseInt(s,10)):s; }
function ymNow(){var d=new Date();return d.getFullYear()+'/'+p2(d.getMonth()+1);}
function todayStr(){var d=new Date();return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate());}
function ymDash(){ return state.ym.replace('/','-'); }
function yy(){ return +state.ym.split('/')[0]; } function mm(){ return +state.ym.split('/')[1]; }

function api(action,payload){
  var body=Object.assign({action:action,token:TOKEN},payload||{});
  return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.text();}).then(function(t){ var o; try{o=JSON.parse(t);}catch(e){o={ok:false,msg:'回應格式錯誤'};}
      if(o&&o.msg&&/登入逾時|未登入/.test(o.msg)){ doLogout(); } return o; })
    .catch(function(){ return {ok:false,msg:'連線失敗,請確認網路或部署網址'}; });
}

/* ===================== 圖示 ===================== */
var I={
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>',
  punch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  leave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c3 4 5 6 5 9a5 5 0 0 1-10 0c0-3 2-5 5-9z"/></svg>',
  transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>',
  roster:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  emp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  site:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/></svg>',
  geo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="11" r="2.5"/></svg>',
  acct:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21h16M6 21V10l6-3 6 3v11"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M19 5l-1 1M6 18l-1 1"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c-5 0-9-4-9-9z"/></svg>'
};
var NAV=[
  {k:'overview',t:'總覽',g:'打卡作業'},{k:'punch',t:'打卡申請',g:'打卡作業'},
  {k:'leave',t:'休假登錄',g:'出勤作業'},{k:'transfer',t:'調休申請',g:'出勤作業'},
  {k:'roster',t:'輪休表',g:'出勤作業'},{k:'report',t:'出勤表',g:'出勤作業'},
  {k:'emp',t:'員工名冊',g:'基本資料'},{k:'site',t:'工地資料',g:'基本資料'},
  {k:'geo',t:'打卡座標',g:'基本資料'},{k:'acct',t:'帳號權限',g:'基本資料'}
];
function isHR(){ return ME.role==='管理員'||ME.role==='人資'; }
function viewAll(){ return ME.role==='管理員'||ME.role==='人資'||ME.role==='主管'; }
function allowScreens(){
  var r=ME.role;
  if(r==='管理員') return ['overview','punch','leave','transfer','roster','report','emp','site','geo','acct'];
  if(r==='人資') return ['overview','punch','leave','transfer','roster','report','emp','site','geo','acct'];
  if(r==='主管') return ['overview','punch','leave','transfer','roster','report','emp','site','geo'];
  if(r==='工地負責人') return ['overview','punch','leave','transfer','roster'];
  return ['overview'];
}

/* ===================== 登入 ===================== */
function doLogin(){
  var u=$('lgUser').value.trim(), p=$('lgPass').value;
  if(!u||!p){ $('lgErr').textContent='請輸入帳號與密碼'; return; }
  $('lgErr').textContent=''; $('lgBtn').textContent='登入中…'; $('lgBtn').disabled=true;
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',user:u,pass:p})})
    .then(function(r){return r.text();}).then(function(t){ var j; try{j=JSON.parse(t);}catch(e){j={ok:false,msg:'回應格式錯誤'};}
      $('lgBtn').textContent='登入'; $('lgBtn').disabled=false;
      if(!j.ok){ $('lgErr').textContent=j.msg||'登入失敗'; return; }
      TOKEN=j.token; ME={name:j.name,role:j.role};
      try{ sessionStorage.setItem('qy_tok',TOKEN); sessionStorage.setItem('qy_me',JSON.stringify(ME)); }catch(e){}
      enterApp();
    }).catch(function(){ $('lgBtn').textContent='登入'; $('lgBtn').disabled=false; $('lgErr').textContent='連線失敗,請確認部署網址'; });
}
function doLogout(){ TOKEN=''; try{sessionStorage.removeItem('qy_tok');sessionStorage.removeItem('qy_me');}catch(e){}
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lgPass').value=''; }
function enterApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('waName').textContent=ME.name; $('waRole').textContent=ME.role;
  state.ym=ymNow(); state.ovDate=''; state.screen='overview';
  renderNav(); render();
}
function renderNav(){
  var allow=allowScreens(), groups={}, order=[];
  NAV.forEach(function(n){ if(allow.indexOf(n.k)<0)return; if(!groups[n.g]){groups[n.g]=[];order.push(n.g);} groups[n.g].push(n); });
  var h='';
  order.forEach(function(g){ h+='<div class="navgrp"><div class="cap">'+g+'</div>';
    groups[g].forEach(function(n){ h+='<div class="nav'+(state.screen===n.k?' on':'')+'" onclick="go(\''+n.k+'\')">'+I[n.k]+'<span>'+n.t+'</span></div>'; });
    h+='</div>'; });
  $('navbox').innerHTML=h;
}
function go(k){ state.screen=k; renderNav(); render(); var m=$('main'); if(m)m.scrollTop=0; }
function toggleTheme(){ var r=document.documentElement, d=r.getAttribute('data-theme')==='dark'; r.setAttribute('data-theme',d?'light':'dark'); try{localStorage.setItem('qy_theme',d?'light':'dark');}catch(e){} }

/* ===================== 版頭 / 月份切換 ===================== */
function pageTop(title,readonly){
  return '<div class="top"><div><div class="eyebrow">管理後台</div><h1>'+esc(title)+'</h1></div>'+
    '<div class="rgt">'+(readonly?'<span class="pill wait">唯讀檢視</span>':'')+
    '<button class="iconbtn" onclick="toggleTheme()">'+I.theme+'</button>'+
    '<div class="userchip"><span class="rp">'+esc(ME.role)+'</span><span class="nm">'+esc(ME.name)+'</span></div></div></div>';
}
function mstep(){ return '<div class="mstep"><button onclick="mshift(-1)">‹</button><span class="lb">'+yy()+' 年 '+mm()+' 月</span><button onclick="mshift(1)">›</button><span class="now" onclick="mThis()">本月</span></div>'; }
function mshift(n){ var y=yy(),m=mm()+n; if(m<1){m=12;y--;} if(m>12){m=1;y++;} state.ym=y+'/'+p2(m); render(); }
function mThis(){ state.ym=ymNow(); render(); }
function rocTitle(){ return '啓宇營造工程股份有限公司　'+(yy()-1911)+' 年 '+mm()+' 月份工地休假輪值表'; }

/* ===================== 派發 ===================== */
function render(){
  var scr={overview:scOverview,punch:scPunch,leave:scLeave,transfer:scTransfer,roster:scRoster,report:scReport,emp:scEmp,site:scSite,geo:scGeo,acct:scAcct}[state.screen];
  if(scr) scr();
}

/* ===================== 總覽 ===================== */
function scOverview(){
  var wk=['日','一','二','三','四','五','六'];
  var cur=state.ovCur||todayStr(); var p=cur.split('/'); var iso=p[0]+'-'+p[1]+'-'+p[2]; var dow=wk[new Date(+p[0],+p[1]-1,+p[2]).getDay()];
  $('main').innerHTML=pageTop('今日總覽',false)+
    '<div class="greet"><div class="g">你好,'+esc(ME.name)+'!以下是出勤概況 👋</div>'+
    '<div class="mstep"><button onclick="ovShift(-1)">‹</button><span class="dp" title="點我開月曆" onclick="var i=this.querySelector(\'input\'); if(i.showPicker){try{i.showPicker();}catch(e){i.focus();}}else i.focus();"><span class="lb">📅 '+esc(cur)+'（'+dow+'）</span><input type="date" value="'+iso+'" onchange="ovPick(this.value)"></span><button onclick="ovShift(1)">›</button><span class="now" onclick="ovToday()">今日</span></div></div>'+
    '<div id="ovBody"><div class="spin">載入中…</div></div>';
  loadOverview();
}
function ovShift(n){ var c=state.ovCur||todayStr(); var p=c.split('/'); var dt=new Date(+p[0],+p[1]-1,+p[2]); dt.setDate(dt.getDate()+n); state.ovDate=dt.getFullYear()+'/'+p2(dt.getMonth()+1)+'/'+p2(dt.getDate()); scOverview(); }
function ovToday(){ state.ovDate=''; state.ovCur=''; scOverview(); }
function ovPick(v){ if(!v)return; state.ovDate=v.replace(/-/g,'/'); scOverview(); }
function lvBoth(p){ var am=p.leaveAM||'', pm=p.leavePM||''; if(!am&&!pm)return p.leave||''; return '上午：'+(am||'—')+'　下午：'+(pm||'—'); }
function statc(ic,svg,lab,val,unit,sub){ return '<div class="stat"><div class="ic '+ic+'">'+svg+'</div><div><div class="lab">'+lab+'</div><div class="val tnum">'+val+'<small>'+unit+'</small></div><div class="sub">'+esc(sub)+'</div></div></div>'; }
function loadOverview(){
  api('admin_overview',{date:state.ovDate}).then(function(d){
    state.ovCur=d.date||todayStr();
    if(!d.ok){ $('ovBody').innerHTML='<div class="empty">'+esc(d.msg||'讀取失敗')+'</div>'; return; }
    var sites=d.sites||[]; var inC=0,outC=0,lv=0,tot=0, notIn=[], onLeave=[];
    sites.forEach(function(g){ g.people.forEach(function(pp){ tot++; if(pp.leave){lv++;onLeave.push({n:pp.name,s:g.site,lv:lvBoth(pp)});return;} if(pp.in)inC++; else notIn.push({n:pp.name,s:g.site}); if(pp.out)outC++; }); });
    var pend=d.pendingAct||0; var need=Math.max(0,tot-lv); var rate=need?Math.round(inC/need*100):0;   // 打卡率不含休假人數
    var h='<div class="cards">'+
      statc('g',I.work,'應出勤 <span class="sm">需打卡</span>',tot,'人','')+
      statc('g',I.overview,'已上班',inC,'人','已下班 '+outC+' 人')+
      statc('a',I.sun,'休假',lv,'人','')+

/* ===================== 休假登錄 / 輪休表（矩陣） ===================== */
function lvSym(am,pm){
  function s(x){ if(!x)return''; x=String(x); if(x.indexOf('例')>=0)return '●'; if(x.indexOf('國')>=0)return '國'; return x.charAt(0); }
  if(am&&pm&&am===pm) return s(am);
  if(am&&pm) return s(am)+s(pm);
  if(am) return '上'+s(am);
  if(pm) return '下'+s(pm);
  return '';
}

  var h1='<tr><th class="lh" rowspan="2">負責人</th><th class="lh" rowspan="2">工地負責人</th><th class="lh" rowspan="2">工地</th><th class="lh">日期</th>';

var ROSTER_CYCLE=['rest','special','draft','clear'];
function setRosterMode(td,mode){
  var dam=td.getAttribute('data-dam')||'', dpm=td.getAttribute('data-dpm')||'';
  var emp=td.getAttribute('data-emp'), day=Number(td.getAttribute('data-day'));
  td.classList.remove('radj','lvcancel','blue'); td.removeAttribute('data-tip'); td.setAttribute('data-mode',mode);
  if(mode==='draft'){ td.setAttribute('data-am',dam); td.setAttribute('data-pm',dpm); td.textContent=symOf(dam,dpm); ROSTER_CHANGES[emp+'_'+day]={empId:emp,day:day,am:dam,pm:dpm}; return; }
  if(mode==='clear'){ td.setAttribute('data-am',''); td.setAttribute('data-pm',''); td.textContent=''; if(dam||dpm){ td.classList.add('lvcancel'); } ROSTER_CHANGES[emp+'_'+day]={empId:emp,day:day,am:'',pm:''}; return; }
  var v=(mode==='special')?'特休':'例假';
  td.setAttribute('data-am',v); td.setAttribute('data-pm',v); td.textContent=symOf(v,v);
  if(v!==dam||v!==dpm)td.classList.add('radj');

function cycleRoster(td){

function downloadB64(b64,filename){

    '<div class="tblwrap"><table class="att"><thead><tr><th rowspan="2" style="width:92px">出勤日期</th><th colspan="4">實際出勤時間</th><th rowspan="2" style="width:64px">狀態</th><th rowspan="2" style="width:96px">備註</th></tr>'+
    '<tr><th>上班<br><span class="sub">(07:30~8:30)</span></th><th>下班<br><span class="sub">(16:30~17:30)</span></th><th>加班開始<br><span class="sub">(加班,需申請)</span></th><th>加班結束<br><span class="sub">(加班,需申請)</span></th></tr></thead><tbody>';
  j.rows.forEach(function(r){
    var dcell='<td class="dt">'+r.roc+'（'+r.wk+'）</td>';
    var trAttr=' data-day="'+r.day+'"'+(ed?' title="右鍵可設定假別"':'');
    if(r.leave){
      h+='<tr class="lvrow"'+trAttr+'>'+dcell+'<td class="lv">'+esc(r.leave)+'</td><td class="lv">'+esc(r.leave)+'</td><td class="lv">'+esc(r.leave)+'</td><td class="lv">'+esc(r.leave)+'</td>'+cell(r.day,'status',r.status,'st')+cell(r.day,'note',r.note,'nt')+'</tr>';
    } else {
      h+='<tr'+trAttr+'>'+dcell+cell(r.day,'in',r.in)+cell(r.day,'out',r.out)+cell(r.day,'otS',r.otS)+cell(r.day,'otE',r.otE)+cell(r.day,'status',r.status,'st')+cell(r.day,'note',r.note,'nt')+'</tr>';
    }
  });
  h+='</tbody></table></div>'+
    '<div class="rpt-notes">'+
      '<p>註1：公司正常工作時間為每日8小時，午休時間為12:00至13:00，午休期間不計入工作時間。<br>　　　員工得於7:30至8:30間上班，並應依實際上班時間完成每日8小時工作。例如8:10上班者，正常下班時間為17:10。</p>'+
      '<p>註2：提早或延後打卡，系統得標示為異常紀錄。提早到場或延後離場，並不當然視為加班；但員工如有實際提供工作，仍應據實申報並由公司依法認定及處理。<br>　　　員工完成當日工作後應即辦理下班打卡。未經核准不得於下班後繼續處理工作。單純留在工地、休息、聊天、等候交通工具或處理私人事務，不列入工作時間。</p>'+
      '<p>註3：因工作需要加班者，原則上應事先提出申請並經主管核准，且應記錄加班開始及結束時間。遇有緊急工作無法事先申請者，應於次一工作日補辦申請。</p>'+
      '<p>註4：本人簽名表示已核對本月份出勤、休假及加班紀錄；如有錯誤或遺漏，應於發現後向主管或人事提出更正申請。</p>'+
    '</div>'+
    '<div class="rpt-sign"><span>工務主管：______________</span><span>人事：______________</span><span>工地負責人：______________</span><span>本人：______________</span></div>'+
    '</div>';
  return h;
}
/** 整個工地批次產生（唯讀,逐頁 A4,可直接列印/PDF）*/
function loadReportBatch(){
  var site=$('rpSite')?$('rpSite').value:'__all__';
  RPT_EDIT=false; RPTCHG={}; RPT_LAST=null;
  $('rpBody').innerHTML='<div class="spin">產生中…（整個工地需要一點時間）</div>';
  if($('rpTools'))$('rpTools').innerHTML='';
  api('admin_reportBatch',{site:site,year:yy(),month:mm()}).then(function(j){
    if(!j.ok){ $('rpBody').innerHTML='<div class="empty">'+esc(j.msg||'產生失敗')+'</div>'; return; }
    if($('rpTools'))$('rpTools').innerHTML='<button class="btn" onclick="window.print()">列印 / PDF（'+j.reports.length+' 頁）</button>';
    $('rpBody').innerHTML=j.reports.map(function(r){ return '<div class="a4">'+reportHtml(r,false)+'</div>'; }).join('');
  });
}

function rptEdit(td){ var d=td.getAttribute('data-day'), f=td.getAttribute('data-f'); if(!RPTCHG[d])RPTCHG[d]={day:Number(d)}; RPTCHG[d][f]=td.textContent.trim(); }
function saveReport(){
  var emp=$('rpEmp').value; if(!emp){ alert('請先選員工'); return; }
  var rows=Object.keys(RPTCHG).map(function(k){return RPTCHG[k];}); if(!rows.length){ alert('沒有變更'); return; }
  rows.forEach(function(rw){ if(rw.leave)return; ['in','out','otS','otE','status','note'].forEach(function(f){ if(rw[f]===undefined){ var td=document.querySelector('.att td[data-day="'+rw.day+'"][data-f="'+f+'"]'); if(td)rw[f]=td.textContent.trim(); } }); });
  var btn=$('rpSave'); if(btn){btn.disabled=true;btn.textContent='儲存中…';}
  api('admin_saveReport',{empId:emp,year:yy(),month:mm(),rows:rows}).then(function(j){
    if(btn){btn.disabled=false;btn.textContent='儲存修正';}
    if(!j.ok){ alert(j.msg||'儲存失敗'); return; } alert('已儲存修正'); RPTCHG={}; RPT_EDIT=false; loadReport();
  });
}

/* ===================== 基本資料（名冊 / 工地 / 座標 / 帳號） ===================== */
var BASE_META={
  emp:{title:'員工名冊',key:'員工編號',add:'新增員工'},
  site:{title:'工地資料',key:'工地別',add:'新增工地'},
  geo:{title:'打卡座標',key:'地點名稱',add:'新增座標'},
  acct:{title:'帳號權限',key:'帳號',add:'新增帳號'}
};
function scEmp(){ baseScreen('emp'); } function scSite(){ baseScreen('site'); } function scGeo(){ baseScreen('geo'); } function scAcct(){ baseScreen('acct'); }
var ROLE_HELP='<div class="panel" style="padding:14px 16px"><b style="font-size:14px">各權限可做的事</b>'+
  '<div class="tblwrap" style="margin-top:10px"><table class="tbl" style="font-size:12.5px">'+
  '<thead><tr><th style="width:110px">權限</th><th>檢視範圍</th><th>可編輯</th><th>可簽核</th></tr></thead><tbody>'+
  '<tr><td><span class="pill bad">管理員</span></td><td>全公司</td><td>全部（含帳號權限）</td><td>全部,可代簽、可取消簽核</td></tr>'+
  '<tr><td><span class="pill info">人資</span></td><td>全公司</td><td>休假登錄／輪休表／出勤表／基本資料</td><td>全部,可代簽、可取消簽核</td></tr>'+
  '<tr><td><span class="pill wait">主管</span></td><td>自己負責的工地</td><td>不可編輯（唯讀）</td><td>自己工地的第二關（工地主管）</td></tr>'+
  '<tr><td><span class="pill mut">工地負責人</span></td><td>自己負責的工地（總覽／打卡申請／調休／休假登錄／輪休表）</td><td>休假登錄：開放期別內可填自己工地</td><td>自己工地的第一關（工地負責人）</td></tr>'+
  '</tbody></table></div>'+
  '<div class="hint" style="margin-top:8px">＊「工地主管／工地負責人」由〈工地資料〉決定,不是由這裡的權限欄決定;此處只決定登入後台能看到什麼。</div></div>';
function baseScreen(which){
  var meta=BASE_META[which]; var edit=isHR();
  $('main').innerHTML=pageTop(meta.title,!edit)+(which==='acct'?ROLE_HELP:'')+
    '<div class="toolbar">'+(edit?'<button class="add" onclick="editBase(\''+which+'\',null)">＋ '+meta.add+'</button>':'')+'<input id="baseSearch" placeholder="搜尋" oninput="filterBase()" style="width:190px" class="spacer"></div>'+
    '<div class="panel"><div class="tblwrap" id="baseBody"><div class="spin">載入中…</div></div></div>';
  api('admin_listBase',{}).then(function(j){
    if(!j.ok){ $('baseBody').innerHTML='<div class="empty">'+esc(j.msg||'讀取失敗（需人資或管理員）')+'</div>'; return; }
    state.base=j.data; renderBase(which,edit);
  });
}
function mapThumb(lat,lng,name){
  var la=Number(lat), ln=Number(lng);
  if(!isFinite(la)||!isFinite(ln)||(!la&&!ln)) return '<span class="hint">—</span>';
  var z=16, n=Math.pow(2,z);
  var xt=Math.floor((ln+180)/360*n);
  var yt=Math.floor((1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n);
  var tile='https://tile.openstreetmap.org/'+z+'/'+xt+'/'+yt+'.png';
  var g='https://www.google.com/maps/search/?api=1&query='+la+','+ln;
  return '<a class="mapthumb" href="'+g+'" target="_blank" rel="noopener" title="'+esc(name||'')+' — 點擊在 Google 地圖開啟">'+
         '<img src="'+tile+'" alt="map" loading="lazy" onerror="this.remove()">'+
         '<span class="pin">📍</span><span class="go">Google 地圖</span></a>';
}
function pillStat(v){ v=String(v); if(v==='在職')return '<span class="pill ok">在職</span>'; if(v==='離職')return '<span class="pill mut">離職</span>'; if(v==='啟用')return '<span class="pill ok">啟用</span>'; if(v==='停用')return '<span class="pill mut">停用</span>'; return esc(v); }
function pillRole(v){ var m={'管理員':'bad','人資':'info','主管':'wait','工地負責人':'mut','一般':'mut'}[String(v)]||'mut'; return '<span class="pill '+m+'">'+esc(v)+'</span>'; }
function renderBase(which,edit){
  var meta=BASE_META[which], t=state.base[which]; if(!t){ $('baseBody').innerHTML='<div class="empty">無資料</div>'; return; }
  var heads=t.headers.filter(Boolean);
  var isGeo=(which==='geo');
  var h='<table class="tbl" id="baseTable"><thead><tr>'+(isGeo?'<th style="width:112px">地圖</th>':'')+heads.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+(edit?'<th class="r">操作</th>':'')+'</tr></thead><tbody>';
  t.rows.forEach(function(r,i){
    h+='<tr>'+(isGeo?('<td>'+mapThumb(r['緯度'],r['經度'],r['地點名稱'])+'</td>'):'')+heads.map(function(x){
      var v=r[x];
      if(x==='姓名'||x==='工地別'||x==='地點名稱'||x==='帳號') return '<td><b>'+esc(v)+'</b></td>';
      if(x==='在職狀態'||x==='狀態') return '<td>'+pillStat(v)+'</td>';
      if(x==='權限') return '<td>'+pillRole(v)+'</td>';
      if(x==='密碼') return '<td class="muted">'+(v?'••••••（已設定）':'—')+'</td>';
      if(x==='LINE_userID') return '<td>'+(v?'<span class="pill ok">已綁定</span>':'<span class="pill bad">未綁定</span>')+'</td>';
      return '<td class="muted">'+esc(v==null||v===''?'—':v)+'</td>';
    }).join('')+(edit?'<td class="r"><div class="actions"><button class="btn sm" onclick="editBase(\''+which+'\','+i+')">編輯</button><button class="btn rj sm" onclick="delBase(\''+which+'\','+i+')">刪</button></div></td>':'')+'</tr>';
  });
  if(!t.rows.length) h+='<tr><td colspan="'+(heads.length+(edit?1:0)+(isGeo?1:0))+'"><div class="empty" style="padding:20px 0">尚無資料</div></td></tr>';
  $('baseBody').innerHTML=h+'</tbody></table>';
}
function filterBase(){ var q=($('baseSearch').value||'').toLowerCase(); var tb=$('baseTable'); if(!tb)return; Array.prototype.forEach.call(tb.tBodies[0].rows,function(tr){ tr.style.display = tr.textContent.toLowerCase().indexOf(q)>=0?'':'none'; }); }
function editBase(which,idx){
  var meta=BASE_META[which], t=state.base[which], heads=t.headers.filter(Boolean);
  var row=idx==null?{}:t.rows[idx]; var origKey=idx==null?'':row[meta.key];
  var fields=heads.map(function(x){
    var v=row[x]==null?'':row[x];
    if(which==='emp'&&x==='LINE_userID') return '<div class="field"><label>LINE_userID（綁定,通常由員工自行綁定）</label><input id="f_'+x+'" value="'+esc(v)+'"></div>';
    if(which==='acct'&&x==='密碼') return '<div class="field"><label>密碼'+(idx==null?'':'（留空＝不變）')+'</label><input id="f_'+x+'" type="text" placeholder="'+(idx==null?'設定密碼':'留空不修改')+'"></div>';
    if(which==='acct'&&x==='權限') return '<div class="field"><label>權限</label><select id="f_'+x+'">'+['管理員','人資','主管','工地負責人','一般'].map(function(o){return '<option'+(String(v)===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>';
    if(x==='在職狀態') return '<div class="field"><label>在職狀態</label><select id="f_'+x+'"><option'+(String(v)==='在職'?' selected':'')+'>在職</option><option'+(String(v)==='離職'?' selected':'')+'>離職</option></select></div>';
    if(x==='是否需打卡') return '<div class="field"><label>是否需打卡</label><select id="f_'+x+'"><option'+(String(v)!=='否'?' selected':'')+'>是</option><option'+(String(v)==='否'?' selected':'')+'>否</option></select></div>';
    if(x==='狀態'&&which==='geo') return '<div class="field"><label>狀態</label><select id="f_'+x+'"><option'+(String(v)!=='停用'?' selected':'')+'>啟用</option><option'+(String(v)==='停用'?' selected':'')+'>停用</option></select></div>';
    return '<div class="field"><label>'+esc(x)+'</label><input id="f_'+x+'" value="'+esc(v)+'"></div>';
  }).join('');
  modal((idx==null?'新增':'編輯')+' · '+meta.title, fields, function(){
    var obj={}; heads.forEach(function(x){ var el=$('f_'+x); if(el) obj[x]=el.value; });
    api('admin_saveRow',{sheet:which,origKey:origKey,row:obj}).then(function(j){ if(!j.ok){alert(j.msg||'儲存失敗');return;} closeModal(); baseScreen(which); });
  });
}
function delBase(which,idx){ var meta=BASE_META[which], row=state.base[which].rows[idx], key=row[meta.key];
  if(!confirm('確定刪除「'+key+'」?此動作無法復原'))return;
  api('admin_deleteRow',{sheet:which,key:key}).then(function(j){ if(!j.ok){alert(j.msg||'刪除失敗');return;} baseScreen(which); });
}

/* ===================== 彈窗 ===================== */
function modal(title,body,onOk){
  $('modalHost').innerHTML='<div class="modal"><div class="box"><h3>'+esc(title)+'</h3>'+body+'<div class="acts"><button class="btn" onclick="closeModal()">取消</button><button class="btn ap" id="mOk">確定</button></div></div></div>';
  $('mOk').onclick=onOk;
}
function closeModal(){ $('modalHost').innerHTML=''; }

try{ var th=localStorage.getItem('qy_theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

$('lgPass').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });
$('btnLogout').onclick=doLogout;
(function boot(){ try{ var t=sessionStorage.getItem('qy_tok'); if(t){ TOKEN=t; ME=JSON.parse(sessionStorage.getItem('qy_me')||'{}'); enterApp(); } }catch(e){} })();
